<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PINTAS 2026 Paper 1 Practice</title><style>:root{--bg:#f5f6f8;--ink:#111827;--muted:#6b7280;--line:#d7dce3;--accent:#173a63}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}.top{max-width:1180px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.btn{display:inline-block;border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;background:#eef1f5;color:var(--ink);cursor:pointer}main{max-width:1180px;margin:auto;padding:18px 20px 60px}.layout{display:grid;grid-template-columns:240px 1fr;gap:18px}.nav{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;height:max-content;position:sticky;top:82px}.nav button,.nav a{width:100%;display:block;text-align:left;border:0;border-radius:10px;padding:11px;margin:4px 0;background:#eef1f5;font-weight:800;text-decoration:none;color:var(--ink)}.nav .on{background:var(--accent);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.part{display:none}.part.on{display:block}.intro,.note{color:var(--muted)}.note{padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}.qcard{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 24px}.qcard h3{margin:0 0 10px;color:var(--accent)}.crop{width:100%;display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:#fff}.qtitle{font-weight:850;line-height:1.5;margin-bottom:10px}.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.opt input{margin-right:8px}.answer{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.fb{display:none;margin-top:9px;padding:10px;border-radius:9px;font-size:13px}.ok{display:block;background:#ecfdf3;color:#166534}.no{display:block;background:#fef2f2;color:#991b1b}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.primary{background:var(--accent);color:#fff}.score{font-size:24px;font-weight:900}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{position:static}}</style></head><body><header><div class="top"><strong>PINTAS 2026 · Paper 1 Practice</strong><div><a class="btn" href="view-paper1.html">PDF / Download</a> <a class="btn" href="index.html">← Back to Hub</a></div></div></header><main><div class="layout"><aside class="nav"><button id="n1" class="on" onclick="showPart(1)">Part 1 · Q1–8</button><button id="n2" onclick="showPart(2)">Part 2 · Q9–18</button><button id="n3" onclick="showPart(3)">Part 3 · Q19–26</button><button id="n4" onclick="showPart(4)">Part 4 · Q27–32</button><button id="n5" onclick="showPart(5)">Part 5 · Q33–40</button><hr><button onclick="save()">Save Progress</button><button onclick="check()">Submit & Check</button><a href="view-paper1.html">PDF / Download Page</a></aside><section class="panel"><div id="parts"></div><div class="actions"><button class="btn primary" onclick="check()">Submit & Check</button><div id="result"></div></div></section></div></main><script>const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const parts={1:{title:'Part 1 · Questions 1–8',note:'Each question is shown separately for easy checking.',q:[ [1,'What is the main idea of the news report?',['A factory was ordered to stop operating because it polluted public drainage.','The State Environment Department will address the issue.','The factory has been in operation since 1974.'],'A'],[2,'Why is Brazilian spinach considered a good alternative to regular spinach?',['It requires hot weather and attracts a lot of insects.','It has no oxalic acid and must be cooked before consumption.','It grows well in hot climates and provides high nutritional value.'],'C'],[3,'What does the text suggest about career choices of the current generation?',['Young people are looking at job security as a career path.','Career decisions today are influenced by versatility and new opportunities.','Technology has made freelancing the most popular career choice among young people.'],'B'],[4,'From the email, we know that ...',["the cream is too sensitive for Damia's skin.",'Sarah had never used this face cream before.','Damia wants to buy the cream for her dry skin.'],'C'],[5,'What does the text say about AI technology?',["It reduces doctors' workload but cannot replace professional advice.","It is gradually replacing doctors in hospitals by handling most patients' queries.",'It is useful for administrative tasks like scheduling but cannot provide any medical guidance.'],'A'],[6,"The spending habits of today's youth differs from the older generations because ...",['they only buy trendy clothes.','of the types of products and services they prefer.','they no longer spend money on holidaying or eating out.'],'B'],[7,'Based on the advertisement, we learn that we can ...',['visit the carnival during the weekends.','watch scientists at work at the carnival.','participate in hands-on activities and experiments.'],'C'],[8,'From the notice above, a complete study loan application will ...',['be accepted for review.','be processed until further review.','be submitted following the closing date.'],'A']]},2:{title:'Part 2 · Questions 9–18',note:'Read the Part 2 text in the original paper / PDF, then choose the best answer for each blank.',q:[[9,'Choose the best answer for blank (9).',['level','balance','vision','task'],'B'],[10,'Choose the best answer for blank (10).',['satisfaction','estimation','evaluation','allocation'],'A'],[11,'Choose the best answer for blank (11).',['reliability','safety','security','maturity'],'C'],[12,'Choose the best answer for blank (12).',['mandatory','essential','acute','compulsory'],'B'],[13,'Choose the best answer for blank (13).',['valuable','precious','premium','ordinary'],'A'],[14,'Choose the best answer for blank (14).',['physical','psychological','technological','biological'],'C'],[15,'Choose the best answer for blank (15).',['cooperation','competition','confirmation','consultation'],'A'],[16,'Choose the best answer for blank (16).',['many','several','diverse','profuse'],'C'],[17,'Choose the best answer for blank (17).',['administered','organised','directed','managed'],'D'],[18,'Choose the best answer for blank (18).',['indulge','focus','uphold','prepare'],'D']]},3:{title:'Part 3 · Questions 19–26',note:'Read the Sungai Merah passage in the original paper / PDF, then answer the questions below.',q:[[19,'What did Adrian sense when he arrived in Sungai Merah?',['He was relieved that nothing has changed.','He made a mistake returning to his hometown.','He was disappointed that the town looks the same.','He felt the town had changed very little but felt different.'],'D'],[20,'When he was young, Adrian left Sungai Merah because he...',['thought success was only found in a bigger city.','did not like living in his grandmother\'s house.','liked tall buildings and crowded streets.','had to move for his current occupation.'],'A'],[21,'In paragraph 3, seeing the mango tree reminded Adrian of...',['his deadlines, disappointments and struggles.','the possibilities the world once held for him.','how he steadily climbed up the ranks.','the big company he worked in.'],'B'],[22,'What showed that Adrian was uncertain of what he was looking for?',['A few boxes full of old clothes to be donated.','Noticing a beautiful ceramic vase beside a box.','The scattered photographs, letters and notebooks.','Finding a small wooden box in the corner of the room.'],'C'],[23,'Being lost is sometimes necessary, for it teaches us what truly matters. What does this line mean?',['Do not get lost on your journey of discovery.','Being lost can help one understand what is important.','We should try to wander far away from home to learn.','His grandmother hopes her grandchildren will find their way home.'],'B'],[24,'After reading the journal, Adrian realises that he has been searching for...',['a sense of belonging.','his dreams and values.','a place to call his own.','success and promotions.'],'A'],[25,'What made Adrian feel that he was still connected to the town?',['His old school friend invited him for dinner.','The café owner made him his favourite drink.','The town\'s people gave to him what he had lost.','The warm interactions with the people of the town.'],'D'],[26,'What can we learn from this story?',['Once you have achieved your ambitions, you need to progress further.','Do not leave your home and family to chase your aspirations.','Finding yourself is just as important as moving forward.','Keep moving forward to achieve your dreams.'],'C']]},4:{title:'Part 4 · Questions 27–32',note:'Choose the sentence A–H that best fits each gap.',opts:['Another simple and effective way is to embrace the second-hand economy.','Cost saving items can be those that look similar but are cheaper than branded ones.','This idea of working to buy things will actually reduce the need to have them.','Here are some steps to secure a good financial foundation.','Instead of looking at the price tag in Ringgit, calculate how many hours you have to work to pay for the item.','Set up an automatic transfer to your second bank account.','Teenagers might struggle to make payments to others.','Try using a simple budgeting app to see exactly where your cash goes.'],ans:{27:'D',28:'F',29:'E',30:'C',31:'H',32:'A'}},5:{title:'Part 5 · Questions 33–40',note:'Questions 33–36: match the statements to A–F. Questions 37–40: type ONE word from the texts.',match:['YouTube Rising Star','TikTok Dance Challenges','Blog Writing','Graphic Design Creations','Online Podcast','Gaming Content Creator'],stat:{33:'I post advice to readers and share my tips about lifestyle topics.',34:'I love creating videos for social media and sharing fun tutorials that help viewers learn new skills.',35:'I enjoy making short clips following online trends and teaming-up with friends to entertain followers.',36:'I work on a project basis, collaborating with different companies as opportunities arise.'},ans:{33:'C',34:'A',35:'B',36:'D'},words:{37:'hashtags',38:'podcast',39:'showcase',40:'gaming'}}};function mcq(n,q,o,a,img){return `<div class="qcard"><h3>Question ${n}</h3>${img?`<img class="crop" src="${img}" alt="Question ${n} stimulus">`:''}<div class="qtitle">${n}. ${q}</div>${o.map((x,i)=>`<label class="opt"><input type="radio" name="q${n}" value="${ABC[i]}"><b>${ABC[i]}</b> ${x}</label>`).join('')}<div class="fb" id="fb${n}" data-answer="${a}"></div></div>`}function render(){let h='';for(let p=1;p<=5;p++){let x=parts[p];h+=`<div id="p${p}" class="part ${p===1?'on':''}"><h2>${x.title}</h2><div class="note">${x.note}</div>`;if(p<=3)x.q.forEach(z=>h+=mcq(z[0],z[1],z[2],z[3],p===1?`assets/q1-q8/q${z[0]}.jpg`:''));if(p===4)for(let n=27;n<=32;n++)h+=mcq(n,`Choose the sentence that best fits gap ${n}.`,x.opts,x.ans[n]);if(p===5){for(let n=33;n<=36;n++)h+=mcq(n,x.stat[n],x.match.map((v,i)=>`${ABC[i]} - ${v}`),x.ans[n]);for(let n=37;n<=40;n++)h+=`<div class="qcard"><h3>Question ${n}</h3><div class="qtitle">${n}. Complete the answer using ONE word from the texts.</div><input class="answer" id="q${n}" data-answer="${x.words[n]}" placeholder="Type one word"><div class="fb" id="fb${n}"></div></div>`}h+='</div>'}document.getElementById('parts').innerHTML=h;restore()}function showPart(n){for(let i=1;i<=5;i++){document.getElementById('p'+i).classList.toggle('on',i===n);document.getElementById('n'+i).classList.toggle('on',i===n)}window.scrollTo({top:0,behavior:'smooth'})}function save(){let a={};document.querySelectorAll('input[type=radio]:checked').forEach(x=>a[x.name]=x.value);for(let n=37;n<=40;n++){let t=document.getElementById('q'+n);if(t)a['q'+n]=t.value}localStorage.setItem('pintas2026paper1',JSON.stringify(a))}function restore(){let a=JSON.parse(localStorage.getItem('pintas2026paper1')||'{}');Object.entries(a).forEach(([k,v])=>{let r=document.querySelector(`input[name="${k}"][value="${v}"]`);if(r)r.checked=true;let t=document.getElementById(k);if(t&&t.classList.contains('answer'))t.value=v})}function check(){save();let s=0,answered=0;for(let n=1;n<=36;n++){let f=document.getElementById('fb'+n),a=f.dataset.answer,y=document.querySelector(`input[name="q${n}"]:checked`);if(y)answered++;if(y&&y.value===a){s++;f.className='fb ok';f.textContent='Correct'}else{f.className='fb no';f.textContent='Correct answer: '+a}}for(let n=37;n<=40;n++){let t=document.getElementById('q'+n),f=document.getElementById('fb'+n),a=t.dataset.answer,v=t.value.trim().toLowerCase();if(v)answered++;if(v===a){s++;f.className='fb ok';f.textContent='Correct'}else{f.className='fb no';f.textContent='Correct answer: '+a}}document.getElementById('result').innerHTML=`<div class="score">${s}/40</div><div>${Math.round(s/40*100)}% · Answered ${answered}/40</div>`}render();</script></body></html>
