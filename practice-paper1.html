<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PINTAS 2026 Paper 1 Practice</title><style>:root{--bg:#f5f6f8;--ink:#111827;--muted:#6b7280;--line:#d7dce3;--accent:#173a63}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}.top{max-width:1180px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.btn{display:inline-block;border:0;border-radius:10px;padding:10px 13px;font-weight:800;text-decoration:none;background:#eef1f5;color:var(--ink)}main{max-width:1180px;margin:auto;padding:18px 20px 60px}.layout{display:grid;grid-template-columns:240px 1fr;gap:18px}.nav{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;height:max-content;position:sticky;top:82px}.nav button{width:100%;text-align:left;border:0;border-radius:10px;padding:11px;margin:4px 0;background:#eef1f5;font-weight:800}.nav .on{background:var(--accent);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.intro{color:var(--muted);margin-top:0}.qcard{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 24px}.qcard h3{margin:0 0 10px;color:var(--accent)}.crop{width:100%;display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}.qtitle{font-weight:850;line-height:1.5;margin-bottom:10px}.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.opt input{margin-right:8px}.fb{display:none;margin-top:9px;padding:10px;border-radius:9px;font-size:13px}.ok{display:block;background:#ecfdf3;color:#166534}.no{display:block;background:#fef2f2;color:#991b1b}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:var(--accent);color:#fff}.score{font-size:24px;font-weight:900}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{position:static}}</style></head><body><header><div class="top"><strong>PINTAS 2026 · Paper 1 Practice</strong><a class="btn" href="index.html">← Back to Hub</a></div></header><main><div class="layout"><aside class="nav"><button class="on">Part 1 · Q1–8</button><button disabled>Part 2 · Q9–18</button><button disabled>Part 3 · Q19–26</button><button disabled>Part 4 · Q27–32</button><button disabled>Part 5 · Q33–40</button><hr><button onclick="save()">Save Progress</button><button onclick="check()">Submit & Check</button></aside><section class="panel"><p class="intro">Part 1 is arranged one question at a time. Each original exam crop is placed directly above its own answer controls for easy checking.</p><div id="questions"></div><div class="actions"><button class="btn primary" onclick="check()">Submit & Check</button><div id="result"></div></div></section></div></main><script>const Q=[{n:1,q:'What is the main idea of the news report?',o:['A factory was ordered to stop operating because it polluted public drainage.','The State Environment Department will address the issue.','The factory has been in operation since 1974.'],a:'A'},{n:2,q:'Why is Brazilian spinach considered a good alternative to regular spinach?',o:['It requires hot weather and attracts a lot of insects.','It has no oxalic acid and must be cooked before consumption.','It grows well in hot climates and provides high nutritional value.'],a:'C'},{n:3,q:'What does the text suggest about career choices of the current generation?',o:['Young people are looking at job security as a career path.','Career decisions today are influenced by versatility and new opportunities.','Technology has made freelancing the most popular career choice among young people.'],a:'B'},{n:4,q:'From the email, we know that ...',o:["the cream is too sensitive for Damia's skin.",'Sarah had never used this face cream before.','Damia wants to buy the cream for her dry skin.'],a:'C'},{n:5,q:'What does the text say about AI technology?',o:["It reduces doctors' workload but cannot replace professional advice.","It is gradually replacing doctors in hospitals by handling most patients' queries.",'It is useful for administrative tasks like scheduling but cannot provide any medical guidance.'],a:'A'},{n:6,q:"The spending habits of today's youth differs from the older generations because ...",o:['they only buy trendy clothes.','of the types of products and services they prefer.','they no longer spend money on holidaying or eating out.'],a:'B'},{n:7,q:'Based on the advertisement, we learn that we can ...',o:['visit the carnival during the weekends.','watch scientists at work at the carnival.','participate in hands-on activities and experiments.'],a:'C'},{n:8,q:'From the notice above, a complete study loan application will ...',o:['be accepted for review.','be processed until further review.','be submitted following the closing date.'],a:'A'}];const L='ABC';document.getElementById('questions').innerHTML=Q.map(x=>`<div class="qcard"><h3>Question ${x.n}</h3><img class="crop" src="assets/q1-q8/q${x.n}.jpg" alt="Question ${x.n} original crop"><div class="qtitle">${x.n}. ${x.q}</div>${x.o.map((o,i)=>`<label class="opt"><input type="radio" name="q${x.n}" value="${L[i]}"><b>${L[i]}</b> ${o}</label>`).join('')}<div class="fb" id="fb${x.n}"></div></div>`).join('');function save(){let a={};document.querySelectorAll('input:checked').forEach(x=>a[x.name]=x.value);localStorage.setItem('pintas2026part1',JSON.stringify(a))}function restore(){let a=JSON.parse(localStorage.getItem('pintas2026part1')||'{}');Object.entries(a).forEach(([k,v])=>{let x=document.querySelector(`input[name="${k}"][value="${v}"]`);if(x)x.checked=true})}function check(){save();let s=0;Q.forEach(x=>{let y=document.querySelector(`input[name="q${x.n}"]:checked`),f=document.getElementById('fb'+x.n);if(y&&y.value===x.a){s++;f.className='fb ok';f.textContent='Correct'}else{f.className='fb no';f.textContent='Correct answer: '+x.a}});result.innerHTML=`<div class="score">${s}/8</div>`}restore();</script></body></html>
